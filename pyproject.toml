[project]
name = "art-critic"
version = "0.1.0"
description = "RLHF demo harness for image preferences"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.2",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "open-clip-torch>=2.29",
    "pillow>=11.0",
    "pyarrow>=26.0.1",
    "torch>=2.5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
